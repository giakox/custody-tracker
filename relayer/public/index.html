<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custody Tracker · rental</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#f6f6f3; --card:#fff; --fg:#1b1b1b; --mute:#6b6b6b; --line:#e3e3de; --ok:#1f7a4d; --bad:#c0392b; --acc:#2d5bd7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --card:#1c1c1c; --fg:#ececec; --mute:#9a9a9a; --line:#2c2c2c; --ok:#4cc38a; --bad:#ff6b5e; --acc:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; }
  .mute { color:var(--mute); } code { font-size:12px; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  #map { height: 460px; border-radius:8px; }
  .status { font-size:22px; font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  a { color:var(--acc); }
  pre { white-space:pre-wrap; word-break:break-all; font-size:12px; margin:0; }
</style>
</head>
<body>
<header>
  <h1>Custody Tracker</h1>
  <span class="mute" id="net"></span>
  <span class="mute" id="contract"></span>
</header>
<main>
  <section class="card"><div id="map"></div></section>
  <section style="display:grid; gap:16px; align-content:start; min-width:0">
    <div class="card">
      <div class="mute">Rental</div>
      <div class="status" id="status">waiting for the first batch</div>
      <div id="custodian" class="mute"></div>
      <div id="terms" class="mute"></div>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
        <button onclick="rent('alice')">Unlock: Alice</button>
        <button onclick="rent('bob')">Unlock: Bob</button>
        <button onclick="giveBack()">Return &amp; settle</button>
        <span id="busy" class="mute"></span>
      </div>
      <div id="balances" class="mute" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="mute" style="margin-bottom:6px">Closed rentals (settled by the RentalEscrow contract)</div>
      <div class="scroll"><table><thead><tr><th>customer</th><th>peak</th><th>tier</th><th>withheld</th><th>refunded</th><th>tx</th></tr></thead><tbody id="settled"></tbody></table></div>
    </div>
    <div class="card">
      <div class="mute" style="margin-bottom:6px">On-chain anchored batches (click a map point for the Merkle proof)</div>
      <div class="scroll"><table><thead><tr><th>seq</th><th>peak</th><th>custodian</th><th>gas</th><th>tx</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div class="card"><div class="mute">Verify a reading</div><pre id="proof">—</pre></div>
  </section>
</main>
<script>
const map = L.map("map").setView([45.455, 9.23], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const COLORS = { owner: "#1f7a4d", alice: "#2d5bd7", bob: "#8e44ad" };
const TIERS = ["none", "light", "medium", "strong"];
const g = (cg) => (Number(cg) / 100).toFixed(1) + " g";
const link = (h) => S.explorer ? `<a target="_blank" href="${S.explorer}/tx/${h}">${h.slice(0, 10)}…</a>` : h.slice(0, 10) + "…";
let lastKey = "", fitted = false, S = null;

async function refresh() {
  S = await (await fetch("/api/state")).json();
  document.getElementById("net").textContent = `${S.network} · chain ${S.chainId}`;
  const c = document.getElementById("contract");
  c.innerHTML = S.explorer ? `<a target="_blank" href="${S.explorer}/address/${S.contract}">${S.contract}</a>` : `<code>${S.contract}</code>`;
  const t = S.terms;
  document.getElementById("terms").textContent = `Collateral ${t.collateral} dUSD · thresholds ${g(t.lightCg)} / ${g(t.mediumCg)} / ${g(t.strongCg)} → withheld ${t.lightBps / 100}% / ${t.mediumBps / 100}% / ${t.strongBps / 100}%`;
  document.getElementById("balances").textContent = "dUSD balances: " + Object.entries(S.balances).map(([r, b]) => `${r} ${Number(b).toFixed(2)}`).join(" · ");
  if (S.onchain) {
    const st = document.getElementById("status");
    if (S.rental) {
      st.textContent = `Rented by ${S.rental.renter} · peak ${g(S.rental.peakCg)} · tier ${TIERS[S.rental.tier]}`;
      st.className = "status " + (S.rental.tier > 0 ? "bad" : "ok");
    } else { st.textContent = "Available (with the owner)"; st.className = "status ok"; }
    document.getElementById("custodian").textContent = `On-chain custodian: ${S.onchain.custodianRole} · period ${S.onchain.period} · last seq ${S.onchain.lastSeq}`;
  }
  document.getElementById("settled").innerHTML = [...S.settlements].reverse().map((x) =>
    `<tr><td>${x.renter}</td><td>${g(x.peakCg)}</td><td class="${x.tier ? "bad" : "ok"}">${TIERS[x.tier]}</td><td>${x.fee}</td><td>${x.refund}</td><td>${link(x.tx)}</td></tr>`).join("");
  const key = S.batches.map((b) => b.tx).join();
  if (key === lastKey) return;
  lastKey = key;
  layer.clearLayers();
  const rows = [];
  for (const b of S.batches) {
    const pts = b.decoded.filter((d) => d.flags & 1).map((d) => [d.lat, d.lon]);
    if (pts.length) L.polyline(pts, { color: COLORS[b.custodian] || "#888", weight: 4 }).addTo(layer);
    b.decoded.forEach((d, i) => {
      if (!(d.flags & 1)) return;
      const shock = d.peakCg > S.maxCg;
      L.circleMarker([d.lat, d.lon], { radius: shock ? 9 : 3, color: shock ? "#c0392b" : COLORS[b.custodian] || "#888", fillOpacity: shock ? .8 : .5 })
        .on("click", () => prove(b.seq, i)).bindTooltip(`seq ${b.seq} #${i} · ${(d.peakCg / 100).toFixed(1)} g`).addTo(layer);
    });
    const tx = S.explorer ? `<a target="_blank" href="${S.explorer}/tx/${b.tx}">${b.tx.slice(0, 10)}…</a>` : b.tx.slice(0, 10) + "…";
    rows.push(`<tr><td>${b.seq}</td><td class="${b.maxPeakCg > S.maxCg ? "bad" : ""}">${(b.maxPeakCg / 100).toFixed(1)} g</td><td>${b.custodian}</td><td>${b.gasUsed}</td><td>${tx}${b.hw ? "" : " <span class='mute'>(sw)</span>"}</td></tr>`);
  }
  document.getElementById("rows").innerHTML = rows.reverse().join("");
  const all = S.batches.flatMap((b) => b.decoded.filter((d) => d.flags & 1).map((d) => [d.lat, d.lon]));
  if (all.length) { map.invalidateSize(); map.fitBounds(all, { padding: [30, 30], maxZoom: 16 }); }
}

async function prove(seq, i) {
  const p = await (await fetch(`/api/proof?seq=${seq}&i=${i}`)).json();
  document.getElementById("proof").innerHTML =
    `<span class="${p.verifiedOnChain ? "ok" : "bad"}">${p.verifiedOnChain ? "✔ verified on-chain (verifyReading)" : "✗ not verified"}</span>\n` +
    `reading: ${JSON.stringify(p.decoded)}\nrecord: ${p.record}\nroot: ${p.root}\nproof (${p.proof.length}):\n${p.proof.join("\n")}`;
}

async function post(path, payload) {
  const busy = document.getElementById("busy");
  busy.textContent = "transactions in progress…";
  try {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload || {}) });
    const j = await r.json();
    if (!r.ok) alert(j.error);
  } finally { busy.textContent = ""; lastKey = ""; refresh(); }
}
const rent = (renter) => post("/api/rental/start", { renter });
const giveBack = () => post("/api/rental/end");

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
